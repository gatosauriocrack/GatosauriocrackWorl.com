<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sistema Solar 3D · Tiempo Real</title>
<style>
  :root{
    --bg:#03040a;
    --panel:#0a0e1a;
    --panel-border:rgba(120,160,255,0.15);
    --text:#dfe6f5;
    --dim:#7c88a8;
    --accent:#ffb454;
    --accent2:#5ad1ff;
    --font-ui:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    --font-mono:'Consolas', 'SFMono-Regular', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text); font-family:var(--font-ui);
  }
  #canvas-container{position:fixed; inset:0;}
  canvas{display:block; touch-action:none;}

  #hud-top{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none; z-index:10;
    gap:10px; flex-wrap:wrap;
  }
  #title-block{pointer-events:none;}
  #title-block h1{
    margin:0; font-size:15px; letter-spacing:3px; font-weight:600;
    text-transform:uppercase; color:var(--text);
  }
  #title-block .sub{
    font-size:11px; color:var(--dim); letter-spacing:1px; margin-top:2px;
  }
  #clock-box{
    pointer-events:auto;
    background:rgba(10,14,26,0.72); backdrop-filter:blur(10px);
    border:1px solid var(--panel-border); border-radius:10px;
    padding:10px 14px; font-family:var(--font-mono); font-size:12px;
    color:var(--accent2); min-width:190px; text-align:right;
  }
  #clock-box .date-line{color:var(--text); font-size:13px; margin-bottom:2px;}
  #clock-box .mode-line{color:var(--dim); font-size:10px; letter-spacing:1px;}

  #controls{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    z-index:10; display:flex; align-items:center; gap:14px;
    background:rgba(10,14,26,0.72); backdrop-filter:blur(10px);
    border:1px solid var(--panel-border); border-radius:14px;
    padding:10px 18px; font-size:12px; color:var(--dim);
    max-width:92vw; flex-wrap:wrap; justify-content:center;
  }
  #controls .grp{display:flex; align-items:center; gap:8px;}
  #controls button{
    background:rgba(255,255,255,0.06); border:1px solid var(--panel-border);
    color:var(--text); border-radius:8px; padding:6px 10px; cursor:pointer;
    font-family:var(--font-ui); font-size:12px; transition:background .15s;
  }
  #controls button:hover{background:rgba(255,255,255,0.14);}
  #controls button.active{background:var(--accent); color:#1a1206; border-color:var(--accent);}
  #speedRange{width:120px; accent-color:var(--accent2);}
  #controls label{font-size:11px; color:var(--dim); letter-spacing:.5px;}

  #planet-label{
    position:fixed; z-index:20; pointer-events:none;
    background:rgba(8,12,22,0.92); border:1px solid rgba(255,180,84,0.4);
    border-radius:10px; padding:12px 16px; min-width:220px; max-width:260px;
    font-size:12px; color:var(--text); opacity:0; transform:translate(-50%,-115%) scale(.95);
    transition:opacity .18s ease, transform .18s ease;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  #planet-label.show{opacity:1; transform:translate(-50%,-125%) scale(1);}
  #planet-label h2{
    margin:0 0 6px 0; font-size:15px; letter-spacing:1px; color:var(--accent);
    text-transform:uppercase;
  }
  #planet-label .row{display:flex; justify-content:space-between; padding:2px 0; border-top:1px solid rgba(255,255,255,0.06);}
  #planet-label .row span:first-child{color:var(--dim);}
  #planet-label .desc{margin-top:8px; color:var(--dim); font-size:11px; line-height:1.4;}
  #planet-label .close-hint{margin-top:8px; font-size:10px; color:#4a5570; text-align:right;}

  #loader{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; transition:opacity .6s ease;
  }
  #loader .ring{
    width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(255,180,84,0.15); border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  #loader .txt{font-family:var(--font-mono); font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #info-btn{
    pointer-events:auto; width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid var(--panel-border);
    color:var(--dim); cursor:pointer; font-size:13px; margin-left:8px;
  }

  @media (max-width:640px){
    #title-block h1{font-size:12px; letter-spacing:2px;}
    #clock-box{min-width:150px; padding:8px 10px; font-size:10.5px;}
    #controls{gap:8px; padding:8px 12px;}
    #controls .grp{gap:5px;}
    #speedRange{width:80px;}
    #planet-label{min-width:180px; max-width:210px; font-size:11px;}
  }
</style>
</head>
<body>

<div id="loader">
  <div class="ring"></div>
  <div class="txt">Calculando efemérides…</div>
</div>

<div id="canvas-container"></div>

<div id="hud-top">
  <div id="title-block">
    <h1>Sistema Solar · Simulación 3D</h1>
    <div class="sub">Posiciones orbitales en tiempo real</div>
  </div>
  <div id="clock-box">
    <div class="date-line" id="dateLine">--</div>
    <div class="mode-line" id="modeLine">MODO: TIEMPO REAL</div>
  </div>
</div>

<div id="planet-label"></div>

<div id="controls">
  <div class="grp">
    <button id="btnRealtime" class="active" title="Usar la fecha y hora real del dispositivo">Tiempo real</button>
    <button id="btnPause" title="Pausar / reanudar el avance del tiempo">Pausa</button>
  </div>
  <div class="grp">
    <label for="speedRange">Velocidad simulada</label>
    <input type="range" id="speedRange" min="0" max="6" step="1" value="0">
  </div>
  <div class="grp">
    <button id="btnOrbits" class="active" title="Mostrar / ocultar líneas orbitales">Órbitas</button>
    <button id="btnLabelsToggle" title="Mostrar / ocultar nombres flotantes">Nombres</button>
    <button id="btnReset" title="Restablecer la cámara">Cámara</button>
  </div>
  <div class="grp">
    <button id="btnMoons" class="active" title="Mostrar / ocultar las lunas principales">Lunas</button>
    <button id="btnComets" class="active" title="Mostrar / ocultar los cometas">Cometas</button>
    <button id="btnConstellations" title="Mostrar / ocultar constelaciones">Constelaciones</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

function scaleRadius(radiusKm){ return Math.pow(radiusKm, 0.42) * 0.055; }
function scaleMoonRadius(radiusKm){ return Math.max(0.09, Math.pow(radiusKm, 0.4) * 0.018); }
function scaleAsteroidRadius(radiusKm){ return Math.max(0.14, Math.pow(radiusKm, 0.42) * 0.02); }

const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);

function getOrbitalAngle(planet, dateMs){
  const daysSinceJ2000 = (dateMs - J2000) / 86400000;
  const meanMotion = 360 / planet.periodDays;
  let L = planet.L0 + meanMotion * daysSinceJ2000;
  L = ((L % 360) + 360) % 360;
  return THREE.MathUtils.degToRad(L);
}

];

function getMoonAngle(moon, dateMs, phaseOffsetDeg){
  const daysSinceJ2000 = (dateMs - J2000) / 86400000;
  const meanMotion = 360 / Math.abs(moon.periodDays);
  const dir = moon.periodDays < 0 ? -1 : 1;
  let L = phaseOffsetDeg + dir * meanMotion * daysSinceJ2000;
  L = ((L % 360) + 360) % 360;
  return THREE.MathUtils.degToRad(L);
}

const NAMED_ASTEROIDS = [
  { name:"Ceres", distAU:2.766, periodDays:1682, L0:95.99, radiusKm:469.7, color:0xb0a48f, desc:"El mayor objeto del cinturón de asteroides, clasificado también como planeta enano." },
  { name:"Vesta", distAU:2.362, periodDays:1325.75, L0:205.0, radiusKm:262.7, color:0xc9c2b0, desc:"El segundo objeto más masivo del cinturón; en cielos muy oscuros llega a verse a simple vista." },

const COMETS = [
  { name:"Cometa Halley", key:"halley", periheAU:0.586, apheAU:35.08, periodDays:27510, tPerihelion: Date.UTC(1986,1,9), inclinationDeg:162.3, argPeriDeg:170, color:0xbfe0ff, desc:"El cometa periódico más famoso, visible a simple vista cada ~76 años. Su próximo perihelio será en 2061." },
  { name:"Cometa Encke", key:"encke", periheAU:0.336, apheAU:4.09, periodDays:1204, tPerihelion: Date.UTC(2023,9,22), inclinationDeg:11.8, argPeriDeg:187, color:0xffd9a0, desc:"Tiene el periodo orbital conocido más corto (~3,3 años) entre los cometas periódicos numerados." }
];

function solveKepler(M, e){
  let E = M;
  for (let i=0;i<6;i++){ E = E - (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E)); }
  return E;
}

function getCometPosition(comet, dateMs){
  const rPeri = scaleDistance(comet.periheAU);
  const rAphe = scaleDistance(comet.apheAU);
  const a = (rPeri + rAphe) / 2;
  const c = (rAphe - rPeri) / 2;
  const e = c / a;
  const daysSincePeri = (dateMs - comet.tPerihelion) / 86400000;
  let frac = (daysSincePeri / comet.periodDays) % 1;
  if (frac < 0) frac += 1;
  const M = frac * Math.PI * 2;
  const E = solveKepler(M, e);
  const nu = 2 * Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
  const r = a * (1 - e*Math.cos(E));
  const omega = THREE.MathUtils.degToRad(comet.argPeriDeg);
  return { x: r*Math.cos(nu+omega), z: r*Math.sin(nu+omega), r };
}

function makeRockyTexture(baseColor, seed){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(baseColor);
  ctx.fillStyle = `rgb(${base.r*255},${base.g*255},${base.b*255})`;
  ctx.fillRect(0,0,256,128);
  let s = seed;
  const rand = () => { s = (s*9301+49297)%233280; return s/233280; };
  for(let i=0;i<420;i++){
    const x = rand()*256, y = rand()*128, r = rand()*3.2+0.4;
    const shade = rand()>0.5 ? 255 : 0;
    ctx.globalAlpha = rand()*0.18;
    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeGasGiantTexture(baseColor, bandColor, seed){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(baseColor);
  const band = new THREE.Color(bandColor);
  let s = seed;
  const rand = () => { s = (s*9301+49297)%233280; return s/233280; };
  const bands = 14;
  for(let i=0;i<bands;i++){
    const t = i/bands;
    const mix = base.clone().lerp(band, Math.sin(t*Math.PI*6)*0.5+0.5);
    ctx.fillStyle = `rgb(${mix.r*255},${mix.g*255},${mix.b*255})`;
    ctx.fillRect(0, (i/bands)*128, 256, 128/bands + 1);
  }
  for(let i=0;i<80;i++){
    ctx.globalAlpha = rand()*0.12;
    ctx.fillStyle = "#ffffff";
    const y = rand()*128;
    ctx.fillRect(0,y,256,rand()*2);
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeSunTexture(){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,128);
  grad.addColorStop(0,"#fff6d5");
  grad.addColorStop(0.5,"#ffcf6b");
  grad.addColorStop(1,"#ff9d3d");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,256,128);
  let s = 7;
  const rand = () => { s = (s*9301+49297)%233280; return s/233280; };
  for(let i=0;i<300;i++){
    ctx.globalAlpha = rand()*0.15;
    ctx.fillStyle = "#ff7a1a";
    ctx.beginPath();
    ctx.arc(rand()*256, rand()*128, rand()*6+1, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  return new THREE.CanvasTexture(c);
}

function buildOrbitLine(radius){
  const segments = 256;
  const points = [];
  for(let i=0;i<=segments;i++){
    const a = (i/segments) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color:0x4a5a80, transparent:true, opacity:0.35 });
  return new THREE.LineLoop(geo, mat);
}

function buildComets(){
  COMETS.forEach((cm) => {
    const group = new THREE.Group();
    group.rotation.x = THREE.MathUtils.degToRad(cm.inclinationDeg);
    scene.add(group);
    const rPeri = scaleDistance(cm.periheAU);
    const rAphe = scaleDistance(cm.apheAU);
    const a = (rPeri + rAphe) / 2;
    const e = (rAphe - rPeri) / 2 / a;
    const omega = THREE.MathUtils.degToRad(cm.argPeriDeg);
    const pts = [];
    for (let s=0; s<=200; s++){
      const nu = (s/200) * Math.PI * 2;
      const r = a*(1-e*e) / (1 + e*Math.cos(nu));
      pts.push(new THREE.Vector3(r*Math.cos(nu+omega), 0, r*Math.sin(nu+omega)));
    }
    const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const orbitMat = new THREE.LineBasicMaterial({ color:0x8fd0ff, transparent:true, opacity:0.28 });
    const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
    group.add(orbitLine);
    orbitLines.push(orbitLine);
    const geo = new THREE.SphereGeometry(0.28, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color: cm.color, emissive: cm.color, emissiveIntensity:0.35, roughness:0.6 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.info = { name: cm.name, type:'comet', rows:[['Perihelio', cm.periheAU + ' UA'],['Afelio', cm.apheAU + ' UA'],['Periodo orbital', Math.round(cm.periodDays/365.25) + ' años aprox.']], desc: cm.desc };
    group.add(mesh);
    const tailCount = 220;
    const tailGeo = new THREE.BufferGeometry();
    tailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(tailCount*3), 3));
    const tailMat = new THREE.PointsMaterial({ color: cm.color, size:0.45, transparent:true, opacity:0.55, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
    const tail = new THREE.Points(tailGeo, tailMat);
    group.add(tail);
    cometMeshes.push({ group, mesh, tail, tailCount, data: cm });
  });
}

function raDecToVec(raDeg, decDeg, radius){
  const theta = THREE.MathUtils.degToRad(raDeg);
  const phi = THREE.MathUtils.degToRad(90 - decDeg);
  return new THREE.Vector3(radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
}

const constellationGroup = new THREE.Group();
function buildConstellations(){
  const R = 1150;
  CONSTELLATIONS.forEach(con => {
    const pts3d = con.stars.map(([ra,dec]) => raDecToVec(ra, dec, R));
    const linePositions = [];
    con.lines.forEach(([a,b]) => { linePositions.push(pts3d[a].x, pts3d[a].y, pts3d[a].z, pts3d[b].x, pts3d[b].y, pts3d[b].z); });
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    const lineMat = new THREE.LineBasicMaterial({ color:0x6fa0ff, transparent:true, opacity:0.45 });
    constellationGroup.add(new THREE.LineSegments(lineGeo, lineMat));
    const starGeo = new THREE.BufferGeometry().setFromPoints(pts3d);
    const starMat = new THREE.PointsMaterial({ color:0xe8f2ff, size:3.2, sizeAttenuation:false, transparent:true, opacity:0.9 });
    constellationGroup.add(new THREE.Points(starGeo, starMat));
    const center = new THREE.Vector3();
    pts3d.forEach(p => center.add(p));
    center.divideScalar(pts3d.length).multiplyScalar(1.02);
    const label = makeNameSprite(con.name);
    label.scale.set(70, 17.5, 1);
    label.material.depthTest = false;
    label.position.copy(center);
    constellationGroup.add(label);
  });
  constellationGroup.visible = false;
  scene.add(constellationGroup);
}

function showBodyLabel(mesh, screenX, screenY){
  const info = mesh.userData.info;
  if (!info) return;
  const rowsHtml = info.rows.map(([k,v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
  labelEl.innerHTML = `<h2>${info.name} <span style="color:var(--dim); font-size:10px; letter-spacing:1px;">· ${TYPE_LABELS[info.type] || ''}</span></h2>${rowsHtml}<div class="desc">${info.desc}</div>`;
  labelEl.style.left = screenX + 'px'; labelEl.style.top = screenY + 'px';
  labelEl.classList.add('show');
}

function hideLabel(){ labelEl.classList.remove('show'); selectedMesh = null; }

function onPointerSelect(clientX, clientY){
  pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const targets = [sunMesh, ...planetMeshes.map(pm => pm.mesh), ...moonMeshes.map(mm => mm.mesh), ...namedAsteroidMeshes.map(am => am.mesh), ...cometMeshes.map(cm => cm.mesh)];
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0){ selectedMesh = hits[0].object; showBodyLabel(selectedMesh, clientX, clientY); } else { hideLabel(); }
}

let constellationsVisible = false;
labelSprites.forEach(s => s.visible = false);

btnMoons.addEventListener('click', () => { moonsVisible = !moonsVisible; moonMeshes.forEach(mm => { mm.pivot.visible = moonsVisible; }); btnMoons.classList.toggle('active', moonsVisible); });
btnComets.addEventListener('click', () => { cometsVisible = !cometsVisible; cometMeshes.forEach(cm => { cm.group.visible = cometsVisible; }); btnComets.classList.toggle('active', cometsVisible); });
btnConstellations.addEventListener('click', () => { constellationsVisible = !constellationsVisible; constellationGroup.visible = constellationsVisible; btnConstellations.classList.toggle('active', constellationsVisible); });
btnRealtime.addEventListener('click', () => { timeState.realtime = true; timeState.paused = false; timeState.speedIndex = 0; speedRange.value = 0; timeState.simMs = Date.now(); btnRealtime.classList.add('active'); btnPause.classList.remove('active'); });
btnPause.addEventListener('click', () => { timeState.paused = !timeState.paused; btnPause.classList.toggle('active', timeState.paused); });
speedRange.addEventListener('input', () => { timeState.speedIndex = parseInt(speedRange.value, 10); timeState.realtime = (timeState.speedIndex === 0); btnRealtime.classList.toggle('active', timeState.realtime); });
btnOrbits.addEventListener('click', () => { orbitsVisible = !orbitsVisible; orbitLines.forEach(l => l.visible = orbitsVisible); btnOrbits.classList.toggle('active', orbitsVisible); });
btnLabelsToggle.addEventListener('click', () => { namesVisible = !namesVisible; labelSprites.forEach(s => s.visible = namesVisible); btnLabelsToggle.classList.toggle('active', namesVisible); });
btnReset.addEventListener('click', () => { camera.position.set(0, 90, 220); controls.target.set(0,0,0); controls.update(); });

function updateSimTime(){
  const now = performance.now();
  const dtMs = now - timeState.lastFrameMs;
  timeState.lastFrameMs = now;
  if (timeState.realtime && !timeState.paused){ timeState.simMs = Date.now(); } else if (!timeState.paused){ timeState.simMs += dtMs * timeState.speedMultipliers[timeState.speedIndex] / 1000 * 1000; }
}

function updateHud(){
  const d = currentSimDate();
  dateLine.textContent = d.toLocaleString('es-ES', { year:'numeric', month:'long', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  modeLine.textContent = timeState.paused ? 'MODO: PAUSADO' : (timeState.realtime ? 'MODO: TIEMPO REAL' : `MODO: SIMULADO (${timeState.speedLabels[timeState.speedIndex]})`);
}

let hudTick = 0;
function animate(){
  requestAnimationFrame(animate);
  updateSimTime();
  const simDate = currentSimDate();
  const simMs = simDate.getTime();
  sunMesh.rotation.y += 0.0007;
  planetMeshes.forEach(pm => {
    const angle = getOrbitalAngle(pm.data, simMs);
    pm.pivot.rotation.y = -angle;
    pm.mesh.rotation.y += (24 / Math.abs(pm.data.rotationHours || 24)) * 0.01;
  });
  moonMeshes.forEach(mm => {
    const angle = getMoonAngle(mm.data, simMs, mm.phase);
    mm.pivot.rotation.y = -angle;
    mm.mesh.rotation.y += 0.015;
  });
  namedAsteroidMeshes.forEach(am => {
    const angle = getOrbitalAngle(am.data, simMs);
    am.pivot.rotation.y = -angle;
    am.mesh.rotation.y += 0.02;
  });
  cometMeshes.forEach(cm => {
    const pos = getCometPosition(cm.data, simMs);
    cm.mesh.position.set(pos.x, 0, pos.z);
    cm.mesh.rotation.y += 0.03;
    const dirLen = Math.hypot(pos.x, pos.z) || 1;
    const dirX = pos.x / dirLen, dirZ = pos.z / dirLen;
    const tailLen = 2.5 + Math.max(0, 30 - pos.r) * 0.18;
    const posAttr = cm.tail.geometry.attributes.position;
    for (let i=0;i<cm.tailCount;i++){
      const t = i / cm.tailCount;
      const spread = (Math.random()-0.5) * 0.7 * (0.3 + t);
      posAttr.setXYZ(i, pos.x + dirX * tailLen * t + spread, spread * 0.6, pos.z + dirZ * tailLen * t + spread);
    }
    posAttr.needsUpdate = true;
  });
  updateSelectedLabelPosition();
  hudTick++;
  if (hudTick % 6 === 0) updateHud();
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
window.addEventListener('load', () => { updateHud(); const loader = document.getElementById('loader'); setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 650); }, 350); animate(); });
</script>
</body>
</html>
