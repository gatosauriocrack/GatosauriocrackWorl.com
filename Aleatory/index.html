<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta property="og:image:width" content="1200">

    <meta name="twitter:title" content="Aleatory - Juego de Reacción">
    <meta name="twitter:description" content="Supera tus límites y pon a prueba tu velocidad en Aleatory.">
    <meta name="twitter:image" content="https://gatosauriocrackworl.com/Aleatory/Aleatory.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --color-principal: #4285F4; --color-fondo: black; --color-texto: white; --color-fondo-menu: #1c1c1c; --color-verde-seleccion: #4CAF50; --color-rojo-salir: #D32F2F; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Arial', sans-serif; background-color: var(--color-fondo); overflow: hidden; color: var(--color-texto); user-select: none; -webkit-tap-highlight-color: transparent; }
        button, .social-auth-btn, .square { outline: none; -webkit-tap-highlight-color: transparent; }
        .game-container { text-align: center; padding: 20px; border-radius: 15px; background-color: var(--color-fondo); position: relative; z-index: 10; }
        #gameArea { display: none; }
        .game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(3px); }
        .modal-content { background-color: var(--color-fondo-menu); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 350px; }
        .social-auth-btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; display: flex; align-items: center; justify-content: center; transition: background-color 0.3s; }
        .google-btn { background-color: #4285F4; color: white; }
        #loginArea { text-align: center; padding: 50px; border: 2px solid #555; border-radius: 10px; }
        #loginButton { padding: 15px 30px; font-size: 1.2em; cursor: pointer; background-color: var(--color-principal); color: white; border: none; border-radius: 5px; margin-top: 20px; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; width: 340px; margin-left: auto; margin-right: auto; }
        #score, #timer { color: var(--color-verde-seleccion); font-size: 1.5em; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; margin: 0 auto; padding: 10px; border-radius: 10px; background-color: #333; }
        .square { width: 100px; height: 100px; background-color: #7C7C7C; cursor: pointer; border-radius: 8px; }
        .target { background-color: #7F7F7F !important; }
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 1); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
        #feedback-overlay.visible { opacity: 1; pointer-events: auto; }
        .fail-icon { color: var(--color-rojo-salir); font-size: 150px; margin-bottom: 20px; }
        .feedback-text { color: white; font-size: 3em; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div id="loginArea" class="game-container">
        <h2>Juego de Aleatory</h2>
        <p><span id="sessionStatus">Sesión: No iniciada</span></p>
        <button id="loginButton">Iniciar Sesión para Jugar</button>
        <button onclick="logout()" id="mainLogoutButton" style="background-color: var(--color-rojo-salir); color: white; padding: 10px 20px; display: none; margin-top: 15px; border: none; border-radius: 5px;">Cerrar Sesión</button>
    </div>
    <div id="gameArea" class="game-container">
        <div class="info-bar">
            <p>Puntos: <span id="score">0</span></p>
            <p>Tiempo: <span id="timer">0:00</span></p>
        </div>
        <div class="grid-container" id="gridContainer"></div>
    </div>
    <div id="feedback-overlay">
        <i class="fas fa-times fail-icon"></i>
        <div class="feedback-text" id="feedbackText"></div> 
        <div class="feedback-text" id="recordStatus" style="font-size: 0.8em; margin-top: 20px; color: #90EE90;"></div>
    </div>
    <div id="authModal" class="game-modal">
        <div class="modal-content">
            <h2>Iniciar Sesión</h2>
            <div id="authMessage" style="color: #F44336; margin: 10px 0;"></div>
            <button class="social-auth-btn google-btn" onclick="signInWithGoogle()"><i class="fab fa-google"></i> Iniciar Sesión con Google</button>
            <button onclick="closeAuthModal()" style="margin-top: 20px; padding: 10px 20px; background-color: #555; color: white; border: none; border-radius: 5px;">← Regresar</button>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBw4Gpq94uUunO5tmuKyJAH6mmMEqvP1j4",
            authDomain: "bikot-worl.firebaseapp.com",
            projectId: "bikot-worl",
            storageBucket: "bikot-worl.firebasestorage.app",
            messagingSenderId: "197140262797",
            appId: "1:197140262797:web:4a03ac108230694ea9d7c4"
        };
        let auth, db, FieldValue, usernamesCol, isFirebaseConnected = false;
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
            FieldValue = firebase.firestore.FieldValue;
            usernamesCol = db.collection('usernames');
            isFirebaseConnected = true;
        } catch (e) {
            auth = { currentUser: null, onAuthStateChanged: (c) => c(null), signOut: () => Promise.resolve() };
            db = null;
        }
        const loginArea = document.getElementById('loginArea'), gameArea = document.getElementById('gameArea'), loginButton = document.getElementById('loginButton'), sessionStatusElement = document.getElementById('sessionStatus'), feedbackOverlay = document.getElementById('feedback-overlay'), recordStatus = document.getElementById('recordStatus');
        function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
        async function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { await auth.signInWithPopup(provider); closeAuthModal(); } catch (e) { document.getElementById('authMessage').textContent = 'Error al iniciar sesión.'; }
        }
        function logout() { auth.signOut(); }
        async function updateSessionUI(user) {
            if (user) {
                sessionStatusElement.textContent = `Sesión: ${user.email} (Activa)`;
                loginArea.style.display = 'none'; gameArea.style.display = 'block'; initGame();
            } else {
                sessionStatusElement.textContent = `Sesión: No iniciada`;
                loginArea.style.display = 'block'; gameArea.style.display = 'none';
            }
        }
        auth.onAuthStateChanged(updateSessionUI);
        loginButton.addEventListener('click', openAuthModal);
        let score = 0, timerInterval = null, gameTimeSeconds = 0;
        function formatTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
        function startTimer() { if(!timerInterval) timerInterval = setInterval(() => { gameTimeSeconds++; document.getElementById('timer').textContent = formatTime(gameTimeSeconds); }, 1000); }
        function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
        async function saveRecord(s, t) {
            const user = auth.currentUser;
            const ref = db.collection("leaderboard_aleatory_game").doc(user.uid);
            const doc = await ref.get();
            if (!doc.exists || s > doc.data().score) {
                await ref.set({ username: user.displayName || user.email.split('@')[0], score: s, timestamp: FieldValue.serverTimestamp() }, { merge: true });
                recordStatus.textContent = '¡NUEVO RÉCORD!';
            }
        }
        function loseGame() {
            stopTimer();
            document.getElementById('feedbackText').innerHTML = `${score} puntos`;
            feedbackOverlay.classList.add('visible');
            if (auth.currentUser) saveRecord(score, gameTimeSeconds);
            setTimeout(() => { feedbackOverlay.classList.remove('visible'); score = 0; gameTimeSeconds = 0; document.getElementById('score').textContent = 0; initGame(); }, 1500);
        }
        function initGame() {
            startTimer();
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            const win = Math.floor(Math.random() * 9);
            for (let i = 0; i < 9; i++) {
                const s = document.createElement('div');
                s.className = 'square' + (i === win ? ' target' : '');
                s.onclick = () => { if (i === win) { score++; document.getElementById('score').textContent = score; initGame(); } else loseGame(); };
                grid.appendChild(s);
            }
        }
    </script>
</body>
</html>
