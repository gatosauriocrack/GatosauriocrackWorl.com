<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Clasificación Global: Aleatory</title>
    <link rel="icon" type="image/png" href="https://gatosauriocrack.github.io/Aleatory/Aleatory.png">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --color-principal: #4CAF50; --color-fondo: #282c34; --color-tablero: #3b4252; --color-texto: #e0e0e0; --color-puntos: #4285F4; }
        body { font-family: sans-serif; background-color: var(--color-fondo); color: var(--color-texto); display: flex; flex-direction: column; align-items: center; padding: 30px; user-select: none; }
        h1 { color: var(--color-principal); border-bottom: 3px solid var(--color-principal); padding-bottom: 5px; margin-bottom: 30px; }
        #records-table { width: 100%; max-width: 900px; border-collapse: separate; border-spacing: 0 15px; }
        #records-table th { background-color: var(--color-principal); color: var(--color-fondo); padding: 18px; text-align: left; border-radius: 8px 8px 0 0; }
        #records-table tr { background-color: var(--color-tablero); border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #records-table td { padding: 18px; }
        .score-cell { color: var(--color-puntos); font-weight: bold; }
        .time-cell { color: var(--color-principal); font-weight: bold; }
        .date-cell { font-size: 0.85em; color: #999; text-align: right; }
    </style>
</head>
<body>
    <h1>⏱️ Tabla de Récords Globales de Aleatory 🏆</h1>
    <p id="message">Cargando récords...</p>
    <table id="records-table">
        <thead>
            <tr>
                <th>Posición</th><th>Usuario</th><th>Puntos</th><th>Tiempo</th><th>Fecha</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBw4Gpq94uUunO5tmuKyJAH6mmMEqvP1j4",
            authDomain: "bikot-worl.firebaseapp.com",
            projectId: "bikot-worl",
            storageBucket: "bikot-worl.firebasestorage.app",
            messagingSenderId: "197140262797",
            appId: "1:197140262797:web:4a03ac108230694ea9d7c4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const leaderboardCol = db.collection('leaderboard_aleatory_game');
        const tbody = document.querySelector('#records-table tbody');
        const messageElement = document.getElementById('message');

        async function fetchRecords() {
            try {
                const querySnapshot = await leaderboardCol.orderBy('score', 'desc').limit(100).get();
                tbody.innerHTML = "";
                messageElement.textContent = "";
                querySnapshot.forEach((doc, index) => {
                    const data = doc.data();
                    const row = tbody.insertRow();
                    row.innerHTML = `<td>${index + 1}</td><td>${data.username}</td><td class="score-cell">${data.score}</td><td class="time-cell">${data.timeFormatted}</td><td class="date-cell">${data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'N/A'}</td>`;
                });
            } catch (error) {
                messageElement.textContent = "Error al cargar: asegúrate de haber creado el índice en Firebase.";
            }
        }
        fetchRecords();
    </script>
</body>
</html>
