<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Clasificación Global: Aleatory</title>
    <link rel="icon" type="image/png" href="https://gatosauriocrack.github.io/Aleatory/Aleatory.png">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --color-principal: #4CAF50; --color-fondo: #282c34; --color-tablero: #3b4252; --color-texto: #e0e0e0; --color-puntos: #4285F4; --max-width-pc: 900px; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--color-fondo); color: var(--color-texto); display: flex; flex-direction: column; align-items: center; padding: 30px; user-select: none; }
        h1 { color: var(--color-principal); border-bottom: 3px solid var(--color-principal); padding-bottom: 5px; margin-bottom: 30px; font-size: 2.5em; }
        #records-table { width: 100%; max-width: var(--max-width-pc); border-collapse: separate; border-spacing: 0 15px; }
        #records-table th, #records-table td { padding: 18px 15px; text-align: left; font-size: 1.05em; }
        #records-table th { background-color: var(--color-principal); color: var(--color-fondo); border-radius: 8px 8px 0 0; }
        #records-table tr { background-color: var(--color-tablero); border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        .score-cell { font-weight: bold; color: var(--color-puntos); }
        .time-cell { font-weight: bold; color: var(--color-principal); }
        .date-cell { font-size: 0.85em; color: #999; text-align: right; }
    </style>
</head>
<body>
    <h1>⏱️ Tabla de Récords Globales de Aleatory 🏆</h1>
    <p id="message">Cargando récords...</p>
    <table id="records-table">
        <thead>
            <tr><th>Posición</th><th>Usuario</th><th>Puntos</th><th>Tiempo</th><th>Fecha/Hora</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcAqXK3qFD8j1T7h6cjO0U3d5nBoVAgVk",
            authDomain: "procesador-56b7a.firebaseapp.com",
            projectId: "procesador-56b7a",
            storageBucket: "procesador-56b7a.firebasestorage.app",
            messagingSenderId: "1029072924025",
            appId: "1:1029072924025:web:c32d735e453416ecfd93a8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const tbody = document.querySelector('#records-table tbody');
        const messageElement = document.getElementById('message');

        async function fetchRecords() {
            try {
                const snapshot = await db.collection('leaderboard_aleatory_game')
                    .orderBy('score', 'desc')
                    .orderBy('timeSeconds', 'asc')
                    .limit(100).get();
                tbody.innerHTML = "";
                messageElement.textContent = snapshot.empty ? "Aún no hay récords." : "";
                snapshot.forEach((doc, i) => {
                    const d = doc.data();
                    const row = tbody.insertRow();
                    row.innerHTML = `<td>${i+1}</td><td>${d.username}</td><td class="score-cell">${d.score}</td><td class="time-cell">${d.timeFormatted || '0:00'}</td><td class="date-cell">${d.timestamp ? d.timestamp.toDate().toLocaleString() : 'N/A'}</td>`;
                });
            } catch (e) {
                messageElement.textContent = "Error: Crea el índice compuesto en Firebase (revisa consola F12).";
                console.error(e);
            }
        }
        fetchRecords();
    </script>
</body>
</html>
